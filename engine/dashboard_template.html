<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta http-equiv=refresh content=180>
<title>THOR paper tracker</title>
<style>
:root{--bg:#060a14;--p1:#0c1424;--p2:#111c31;--ln:#1d2a44;--tx:#d6e2f5;--mu:#7486a6;--g:#19f28c;--r:#ff4d6a;--c:#22d3ee;--y:#ffc94d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,#0d1a33,transparent),var(--bg);color:var(--tx);font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:100vh}
header{padding:14px 18px;border-bottom:1px solid var(--ln);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:18px;letter-spacing:2px}h1 b{color:var(--c)}h1 small{color:var(--mu);font-size:11px;letter-spacing:0}
h2{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--c);margin:0 0 8px}
.meta{color:var(--mu);font-size:12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;box-shadow:0 0 8px currentColor}
main{padding:14px 18px;max-width:1500px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.card{background:linear-gradient(160deg,var(--p2),var(--p1));border:1px solid var(--ln);border-radius:10px;padding:10px 12px;cursor:pointer}.card:hover,.card.on{border-color:var(--c)}
.card .n{color:var(--mu);font-size:11px;letter-spacing:1px}.card .v{font-size:20px;font-weight:700;margin:2px 0}.card .s{font-size:11px;color:var(--mu)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--ln);margin-bottom:14px}.tabs button{background:none;border:0;color:var(--mu);padding:8px 14px;font:inherit;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}.tabs button.on{color:var(--c);border-color:var(--c)}
.panel{background:var(--p1);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:14px}
.hot{border-color:var(--y);box-shadow:0 0 0 1px #ffc94d33,0 0 24px #ffc94d18}.hot h2{color:var(--y)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.grid2>*{min-width:0}@media(max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.g{color:var(--g)}.r{color:var(--r)}.mu{color:var(--mu)}.y{color:var(--y)}
.fb{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.fb input,.fb select{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:5px 7px;font:inherit;font-size:12px}.fb input{flex:1;min-width:120px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:5px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--ln)}th:first-child,td:first-child{text-align:left}
th{color:var(--mu);font-weight:500;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--p1)}th.s1:after{content:" ▲"}th.s-1:after{content:" ▼"}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--p2)}.cnt{color:var(--mu);font-size:11px;font-weight:400;letter-spacing:0}
.pill{padding:1px 6px;border-radius:9px;font-size:11px;border:1px solid currentColor}
svg text{fill:var(--mu);font-size:10px}.tip{position:fixed;pointer-events:none;background:#0a1222ee;border:1px solid var(--c);border-radius:6px;padding:6px 8px;font-size:11px;display:none;z-index:9}
#det{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:var(--p2);border-left:1px solid var(--c);transform:translateX(105%);transition:.2s;z-index:8;overflow:auto;padding:16px}#det.on{transform:none}
#det .cht{margin:8px 0 10px}#det .cht .tfb{display:flex;gap:4px;margin-bottom:4px}#det .cht .tfb button{background:var(--p1);color:var(--mu);border:1px solid var(--bd,#333);border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer}#det .cht .tfb button.on{color:var(--tx,#fff);border-color:#19f28c}#det .cht .box{position:relative;height:260px}#det .cht .zone{position:absolute;left:0;right:56px;background:rgba(255,201,77,.12);border-top:1px dashed rgba(255,201,77,.5);border-bottom:1px dashed rgba(255,201,77,.5);pointer-events:none;z-index:2}#det .cht .msg{font-size:11px;color:var(--mu);padding:4px 0}
#det dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}#det dt{color:var(--mu)}#det dd{margin:0;text-align:right}#det .x{float:right;background:none;border:1px solid var(--ln);color:var(--tx);border-radius:6px;cursor:pointer;padding:2px 9px}
#det pre{white-space:pre-wrap;color:var(--mu);font-size:11px;background:var(--p1);padding:8px;border-radius:6px}
#keym{position:fixed;inset:0;background:#000a;display:none;z-index:10;align-items:center;justify-content:center}#keym.on{display:flex}#keym>div{background:var(--p2);border:1px solid var(--c);border-radius:10px;max-width:760px;width:94%;max-height:88vh;overflow:auto;padding:16px 18px;line-height:1.55}#keym h3{margin:14px 0 4px}#keym ul{margin:4px 0;padding-left:18px}.qb{background:none;border:1px solid var(--c);color:var(--c);border-radius:50%;width:24px;height:24px;cursor:pointer;font:inherit;font-weight:700}
.panel>h2{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.panel>h2:before{content:"▾ ";color:var(--mu);display:inline-block;width:1.1em;transition:transform .15s}.panel.col>h2:before{transform:rotate(-90deg)}.panel.col>:not(h2){display:none!important}.panel.col>h2{margin-bottom:0}
.empty{color:var(--mu);padding:8px}
</style></head><body>
<header><h1><b>THOR</b> PAPER TRACKER <small>paper only · no orders · no keys</small></h1><div style="display:flex;gap:10px;align-items:center"><div class=meta id=meta></div><button class=qb id=qb title="Account key">?</button></div></header><div id=keym><div id=keyb></div></div>
<main><div class=cards id=cards></div><div class=tabs id=tabs></div><div id=view></div></main>
<aside id=det></aside><div class=tip id=tip></div>
<script>
const DATA=/*__DATA__*/null;
(function(){
"use strict";
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const OFF=-7*3600e3,p2=n=>String(n).padStart(2,"0");
const ft=(ms,y)=>{if(ms==null)return"";const d=new Date(ms+OFF);return(y?d.getUTCFullYear()+"-":"")+p2(d.getUTCMonth()+1)+"-"+p2(d.getUTCDate())+" "+p2(d.getUTCHours())+":"+p2(d.getUTCMinutes())};
const fp=v=>{if(v==null||v==="")return"";const a=Math.abs(v);return a===0?"0":a>=1000?v.toFixed(1):a>=1?v.toFixed(4).replace(/0+$/,"").replace(/\.$/,""):Number(v.toPrecision(4)).toString()};
const fm=v=>v==null?"":(v<0?"-$":"$")+Math.abs(v).toFixed(2),pc=v=>v==null?"":(v>0?"+":"")+v.toFixed(2)+"%";
const cls=v=>v>0?"g":v<0?"r":"mu",dir=d=>`<span class="${d==="Long"?"g":"r"}">${esc(d)}</span>`;
const obj=(cols,rows)=>rows.map(r=>Object.fromEntries(cols.map((c,i)=>[c,r[i]])));
const SIG=obj(DATA.signal_cols,DATA.signals),TR=obj(DATA.trade_cols,DATA.trades),SK=Object.fromEntries(SIG.map(s=>[s.key,s]));
const PORTS=Object.keys(DATA.portfolios),B=DATA.buckets,C=DATA.costs||{},FEE=(C.taker_fee||0)+(C.slippage||0);
const bucket=v=>{if(v==null)return"n/a";for(let i=1;i<B.length;i++)if(v<=B[i])return"("+B[i-1]+","+B[i]+"]";return">"+B[B.length-1]};
TR.forEach(t=>{const s=SK[t.key]||{};Object.assign(t,{entry_low:s.entry_low,entry_high:s.entry_high,tp1:s.tp1,tp2:s.tp2,tp3:s.tp3,invalid:s.invalid,last_px:s.last_px,raw_text:s.raw_text,source:s.source,
 fees:t.notional?t.notional*FEE*(t.status==="closed"?2:1):null,bucket:bucket(t.confluence),kind:"trade"})});
SIG.forEach(s=>{s.bucket=bucket(s.confluence);s.kind="signal";const m=(s.entry_low+s.entry_high)/2;s.tp1_dist=m?100*Math.abs(s.tp1-m)/m:null;s.tp1_from_last=s.last_px?100*Math.abs(s.tp1-s.last_px)/s.last_px:null});
const EQ=DATA.equity||{},COL={MAIN:"#19f28c",CONTROL:"#22d3ee",TOP_ASSETS:"#ffc94d",ALL:"#b18cff",FAST:"#ff5d8f",MAIN_LOOSE:"#7dffb8",CONFLUENCE_ONLY:"#ff9f43",RUNNERS:"#4dd0ff",BETTER_ENTRY:"#e0e0e0",BTC_TREND:"#f7c948",FRESH_ONLY:"#c56cff",FAST_RUNNERS:"#ff77c8",MAIN_TP2:"#00e5a0",FAST_HALF:"#ffb3d9",MAIN_1D:"#a3ff3d"},col=(p,i)=>COL[p]||["#ff8a4d","#4dd0ff"][i%2];
function pstats(p){const st=DATA.portfolios[p].start||1000,e=EQ[p]||[],last=e.length?e[e.length-1][1]:st;let pk=-1e18,dd=0;e.forEach(([,v])=>{pk=Math.max(pk,v);dd=Math.max(dd,1-v/pk)});return{start:st,last,chg:100*(last/st-1),dd:100*dd}}
// header
const hb=DATA.heartbeat||{},now=Date.now(),hbts=hb.ts?Date.parse(hb.ts.replace(" ","T")+"-07:00"):null,age=hbts?(now-hbts)/1e3:null,lim=(DATA.poll_seconds||180)*2.5;
const PUB=/github\.io$/.test(location.hostname),gage=(now-DATA.generated)/1e3,hc=PUB?(gage<1200?"var(--g)":gage<2700?"var(--y)":"var(--r)"):(age==null?"var(--r)":age<lim?"var(--g)":age<lim*3?"var(--y)":"var(--r)");
const ag=s=>s<120?Math.round(s)+"s":Math.round(s/60)+"m";
$("#meta").innerHTML=PUB?`<span><span class=dot style="color:${hc};background:${hc}"></span>Published snapshot · data from <b>${ft(DATA.generated,1)} MST</b> (${ag(gage)} ago; ${DATA.engine==='actions'?'GitHub Actions engine, runs every ~5–15 min':'box publisher, every ~10 min'})</span><span>${Object.entries(hb.status||{}).map(([k,v])=>k+":"+v).join(" · ")}</span>`:`<span>Updated <b>${ft(DATA.generated,1)} MST</b></span><span title="${esc(JSON.stringify(hb))}"><span class=dot style="color:${hc};background:${hc}"></span>Heartbeat ${hb.ts?esc(hb.ts.slice(5))+" MST":"missing"}${age!=null?` (${age<120?Math.round(age)+"s":Math.round(age/60)+"m"} ago)`:""}</span><span>${Object.entries(hb.status||{}).map(([k,v])=>k+":"+v).join(" · ")}</span>`;
let TAB="OVERVIEW";
function cards(){$("#cards").innerHTML=PORTS.map(p=>{const s=pstats(p),o=TR.filter(t=>t.portfolio===p&&t.status==="open").length;return`<div class="card${TAB===p?" on":""}" data-p="${p}"><div class=n style="color:${col(p)}">${p}</div><div class=v>$${s.last.toFixed(2)}</div><div class="s"><span class=${cls(s.chg)}>${pc(s.chg)}</span> · ${o} open · DD ${s.dd.toFixed(1)}%${(DATA.margin||{})[p]?` · margin ${(100*DATA.margin[p].used/DATA.margin[p].equity).toFixed(1)}%`:""}</div></div>`}).join("");
 document.querySelectorAll(".card").forEach(c=>c.onclick=()=>go(c.dataset.p))}
function tabs(){$("#tabs").innerHTML=["OVERVIEW","JOURNAL",...PORTS].map(t=>`<button class="${t===TAB?"on":""}" data-t="${t}">${t}</button>`).join("");document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>go(b.dataset.t))}
// generic table
const COLS={
 sym:{k:"symbol",l:"Asset"},tf:{k:"timeframe",l:"TF"},dir:{k:"direction",l:"Dir",f:dir},cf:{k:"confluence",l:"Score"},htf:{k:"htf_confluent",l:"HTF"},pf:{k:"portfolio",l:"Pf"},lv:{k:"leverage",l:"Lev",f:(v,r)=>v==null?"":v+"x"+(r&&r.max_lev===v?" <span class=y title=\"at asset max leverage\">max</span>":"")},mgs:{k:"margin",l:"Margin (all pfs)",f:v=>v?fm(v):""},lq:{k:"liq_px",l:"Liq px",f:fp},mg:{k:"margin",l:"Margin",f:v=>v?fm(v):""},
 st:{k:"status",l:"Status",f:v=>`<span class="pill ${v==="closed"?"mu":v==="open"||v==="filled"?"c":v==="pending"?"y":"mu"}">${esc(v)}</span>`},
 el:{k:"entry_low",l:"Entry lo",f:fp},eh:{k:"entry_high",l:"Entry hi",f:fp},en:{k:"entry",l:"Entry",f:fp},sp:{k:"stop",l:"Stop",f:fp},t1:{k:"tp1",l:"TP1",f:fp},iv:{k:"invalid",l:"Invalid",f:fp},
 lp:{k:"last_px",l:"Last",f:fp},xp:{k:"exit_px",l:"Exit px",f:fp},rs:{k:"reason",l:"Reason"},no:{k:"notional",l:"Size",f:v=>v?fm(v):""},
 pnl:{k:"pnl",l:"PnL",f:v=>`<span class=${cls(v)}>${fm(v)}</span>`},r:{k:"r",l:"R",f:v=>v==null?"":`<span class=${cls(v)}>${v.toFixed(2)}</span>`},
 fill:{k:"fill_ts",l:"Filled",f:v=>ft(v)},exit:{k:"exit_ts",l:"Exit",f:v=>ft(v)},seen:{k:"first_seen_ts",l:"Seen",f:v=>ft(v)},start:{k:"start_ts",l:"Start",f:v=>ft(v)},
 d1:{k:"tp1_dist",l:"TP1 %",f:v=>v==null?"":v.toFixed(2)},d2:{k:"tp1_from_last",l:"TP1 from last %",f:v=>v==null?"":v.toFixed(2)},src:{k:"source",l:"Src"},dz:{k:"dist",l:"To entry %",f:v=>v==null?"":(v===0?"<span class=g>in zone</span>":v.toFixed(2))}};
let TID=0;const ROWS={};
function table(title,rows,cols,o={}){const id="t"+(TID++);let sv=null;if(o.persist)try{sv=JSON.parse(localStorage.getItem("thor.sort."+o.persist)||"null")}catch(e){}ROWS[id]={rows,cols:cols.map(c=>COLS[c]),sort:sv?sv.k:(o.sort||null),dirn:sv?sv.d:(o.dirn||-1),f:{},persist:o.persist};
 const uniq=k=>[...new Set(rows.map(r=>r[k]).filter(v=>v!=null))].sort();
 const sel=(k,l)=>{const u=uniq(k);return u.length>1?`<select data-k="${k}"><option value="">${l}: all</option>${u.map(v=>`<option>${esc(v)}</option>`).join("")}</select>`:""};
 const fb=rows.length>3?`<div class=fb><input placeholder="search…" data-k="q">${sel("symbol","Asset")}${sel("timeframe","TF")}${sel("direction","Dir")}${sel("status","Status")}${sel("bucket","Score")}${o.pf?sel("portfolio","Pf"):""}</div>`:"";
 return`<div class="panel${o.hot?" hot":""}"><h2>${title} <span class=cnt id="${id}c"></span></h2>${o.note?`<div class=mu style="margin:-4px 0 8px;font-size:11px">${o.note}</div>`:""}${fb}<div class=tw data-id="${id}"><table id="${id}"></table></div></div>`}
function render(id){const T=ROWS[id],f=T.f,q=(f.q||"").toLowerCase();let rs=T.rows.filter(r=>Object.entries(f).every(([k,v])=>!v||k==="q"||String(r[k])===v)&&(!q||Object.values(r).some(v=>typeof v==="string"&&v.toLowerCase().includes(q))));
 if(T.sort){const k=T.sort,d=T.dirn;rs=rs.slice().sort((a,b)=>{const x=a[k],y=b[k];return x==null?1:y==null?-1:(x>y?1:x<y?-1:0)*d})}
 const el=document.getElementById(id);el._rows=rs;if(T.onR)T.onR(rs);document.getElementById(id+"c").textContent=rs.length===T.rows.length?`(${rs.length})`:`(${rs.length}/${T.rows.length})`;
 el.innerHTML=`<thead><tr>${T.cols.map(c=>`<th data-k="${c.k}" class="${T.sort===c.k?"s"+T.dirn:""}">${c.l}</th>`).join("")}</tr></thead><tbody>${rs.length?rs.map((r,i)=>`<tr data-i="${i}">${T.cols.map(c=>`<td>${c.f?c.f(r[c.k],r):esc(r[c.k])}</td>`).join("")}</tr>`).join(""):`<tr><td class=empty colspan=${T.cols.length}>none</td></tr>`}</tbody>`}
function wire(){for(const id in ROWS){const el=document.getElementById(id);if(!el)continue;render(id);const P=el.closest(".panel");
 P.querySelectorAll(".fb [data-k]").forEach(i=>i.oninput=()=>{ROWS[id].f[i.dataset.k]=i.value;render(id)});
 el.onclick=e=>{const th=e.target.closest("th");if(th){const T=ROWS[id];T.dirn=T.sort===th.dataset.k?-T.dirn:(th.dataset.k==="dist"?1:-1);T.sort=th.dataset.k;saveSort(T);render(id);return}const tr=e.target.closest("tr[data-i]");if(tr)detail(el._rows[+tr.dataset.i])}}}

// collapsible panels: click/tap the header; state per panel title in localStorage (survives auto-reload)
const COLDEF=/^(Skipped by portfolio rules|Resolved signals|Pending signals)/;
function collapsibles(){document.querySelectorAll("#view .panel").forEach(p=>{const h=p.querySelector(":scope>h2");if(!h||h._c)return;h._c=1;
 const k="thor.col."+h.childNodes[0].textContent.trim().replace(/\s*\(.*$/,"").replace(/^[^A-Za-z]+/,"");let v=null;try{v=localStorage.getItem(k)}catch(e){}
 if(v==="1"||(v==null&&COLDEF.test(k.slice(9))))p.classList.add("col");
 h.addEventListener("click",()=>{const c=p.classList.toggle("col");try{localStorage.setItem(k,c?"1":"0")}catch(e){}if(!c&&p.querySelector("[id^=c]")&&typeof drawCharts==="function")drawCharts()})})}

// trade sizing (same rule as tracker.leverage): 1% risk on $1,000, stop = TP1 dist / stop_rr, lev = max whole L<=HL max with liq >= buffer x stop dist away
function sizing(s,o={}){if(!s||s.tp1==null||s.entry_low==null)return null;const sh=s.direction==="Short",sg=sh?-1:1,filled=s.entry!=null&&s.fill_ts!=null,e0=filled?s.entry:(sh?s.entry_low:s.entry_high),e=o.e>0?o.e:e0;
 const rr=DATA.stop_rr||1.5,d1=Math.abs(s.tp1-e),stop0=filled&&s.stop!=null&&!(o.e>0)?s.stop:e-sg*d1/rr,stop=o.stop>0?o.stop:stop0,acct=o.acct>0?o.acct:1000,rp=o.rp>0?o.rp:1,risk=acct*rp/100;
 const sd=Math.abs(e-stop)/e,C2=2*FEE,n=Math.min(risk/(sd+C2),acct),mx=(DATA.hlmax||{})[s.symbol]||null,buf=(DATA.leverage_cfg||{}).liq_buffer||1.5,bad=(stop-e)*sg>=0;
 let lv=null,liq=null;if(mx&&!bad){const m=1/(2*mx);lv=Math.max(1,Math.min(mx,Math.floor(1/(m+buf*sd*(1-sg*m)))));liq=e-sg*(e/lv-e*m)/(1-sg*m)}
 return{e,e0,stop,stop0,sd,rr,n,qty:n/e,mx,lv,liq,filled,acct,rp,risk,bad,capped:n>=acct-1e-9}}
const CALC={acct:1000,rp:1};try{Object.assign(CALC,JSON.parse(localStorage.getItem("thor.calc")||"{}"))}catch(e){}
function calcInit(s){const box=document.getElementById("calc");if(!box)return;const z0=sizing(s,{acct:CALC.acct,rp:CALC.rp}),sym=esc((s.symbol||"").split("/")[0]);
 const inp=(k,v,step,lab)=>`<label style="display:flex;flex-direction:column;font-size:11px;color:var(--mu);flex:1;min-width:110px">${lab}<input data-k=${k} type=number inputmode=decimal step=${step} value="${v}" style="background:var(--p1);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:7px;font:inherit;font-size:16px;margin-top:2px;width:100%"></label>`;
 box.innerHTML=`<div id=calch style="color:var(--c);letter-spacing:1px;margin-bottom:6px"></div><div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">${inp("acct",CALC.acct,"100","Account $")}${inp("rp",CALC.rp,"0.25","Risk %")}${inp("e",+z0.e0.toPrecision(6),"any","Entry "+(z0.filled?"(fill)":"(range edge)"))}${inp("stop",+z0.stop0.toPrecision(6),"any","Stop")}</div><dl id=calco style="display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0"></dl><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px"><span class=mu style="font-size:10px">Account size and risk % are remembered on this device.</span><button id=calcr style="background:none;border:1px solid var(--ln);color:var(--tx);border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer">Reset</button></div>`;
 const run=()=>{const v={};box.querySelectorAll("input").forEach(i=>v[i.dataset.k]=parseFloat(i.value));CALC.acct=v.acct>0?v.acct:1000;CALC.rp=v.rp>0?v.rp:1;try{localStorage.setItem("thor.calc",JSON.stringify({acct:CALC.acct,rp:CALC.rp}))}catch(e){}
  const z=sizing(s,{acct:CALC.acct,rp:CALC.rp,e:v.e,stop:v.stop});const O=[],a=(k,x)=>O.push(`<dt>${k}</dt><dd>${x}</dd>`);
  document.getElementById("calch").textContent=`SIZING · $${CALC.acct.toLocaleString("en-US")} ACCOUNT, ${CALC.rp}% RISK ($${z.risk.toLocaleString("en-US",{maximumFractionDigits:2})})`;
  if(z.bad){document.getElementById("calco").innerHTML=`<dt class=r style="grid-column:1/-1">Stop is on the wrong side of entry</dt>`;return}
